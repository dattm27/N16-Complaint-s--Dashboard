<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consumer Complaints Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell book-layout">
      <header class="book-header">
        <section class="hero-and-kpis" aria-label="Complaint summary">
          <h1>Complaints Dashboard</h1>
          <div class="book-kpis">
            <span class="total-label">Total Complaints:</span>
            <div class="book-kpi closed-kpi">
              <span>Closed</span>
              <strong id="closed-complaints" data-testid="closed-complaints">0</strong>
            </div>
            <div class="book-kpi open-kpi">
              <span>Open</span>
              <strong id="open-complaints" data-testid="open-complaints">0</strong>
            </div>
            <div class="book-kpi">
              <span>Total</span>
              <strong id="total-complaints" data-testid="total-complaints">0</strong>
            </div>
          </div>
          <p id="date-window" class="date-window">Selected period</p>
          <p id="oldest-open" class="visually-hidden">Oldest open: n/a</p>
          <p id="open-rate" class="visually-hidden" data-testid="open-rate">0%</p>
        </section>

        <section class="book-controls" aria-label="Dashboard filters">
          <label class="date-control">
            <span>Date Received</span>
            <span class="date-line">
              <output id="start-date-label" for="start-date">01/01/2015</output>
              <span class="range-control">
                <span id="range-fill" class="range-fill" aria-hidden="true"></span>
                <input id="start-date" type="range" min="0" max="0" value="0" step="1" aria-label="Start date" data-testid="start-date">
                <input id="end-date" type="range" min="0" max="0" value="0" step="1" aria-label="End date" data-testid="end-date">
              </span>
              <output id="end-date-label" for="end-date">19/03/2015</output>
            </span>
          </label>
          <div class="select-row">
            <label>
              <span>Source Type</span>
              <select id="product-filter" data-testid="product-filter">
                <option value="all">All</option>
              </select>
            </label>
            <label>
              <span>Show Open/Closed</span>
              <select id="status-filter" data-testid="status-filter">
                <option value="all">All</option>
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
              </select>
            </label>
          </div>
          <button id="reset-btn" type="button" data-testid="reset-btn">Reset View</button>
          <input id="search-box" class="visually-hidden" type="search" tabindex="-1" aria-hidden="true">
          <button id="export-btn" class="visually-hidden" type="button" tabindex="-1" aria-hidden="true">Export CSV</button>
        </section>
      </header>

      <section id="active-filters" class="active-filters" aria-live="polite"></section>

      <section class="dashboard-grid">
        <article class="panel time-panel">
          <div class="panel-header">
            <h2>Complaints by Month</h2>
          </div>
          <div id="time-chart" class="chart-area" data-testid="time-chart"></div>
        </article>

        <article class="panel map-panel">
          <div class="panel-header inline-note">
            <h2>Open Complaints by State <em>(click to filter)</em></h2>
            <p id="map-meta" class="visually-hidden">Each state has equal visual weight.</p>
          </div>
          <div id="state-map" class="map-area" data-testid="state-map"></div>
        </article>

        <article class="panel reason-panel">
          <div class="panel-header">
            <h2>Complaints by Reason</h2>
          </div>
          <div id="issue-chart" class="chart-area diverging-area" data-testid="issue-chart"></div>
        </article>

        <article class="panel party-panel">
          <div class="panel-header inline-note">
            <h2>Complaints by Party <em>(click to filter)</em></h2>
          </div>
          <div id="company-chart" class="chart-area diverging-area" data-testid="company-chart"></div>
        </article>
      </section>
    </main>

    <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
